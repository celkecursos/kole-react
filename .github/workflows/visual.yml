# Teste visual da demo (tests/visual): compara cada página, nos temas claro, escuro e
# sistema, com a referência de Linux guardada em tests/visual/__referencia__/linux/.
# Roda na imagem do Playwright para o print sair igual ao da referência.
#
# Mudança visual de propósito: rode este workflow à mão (Actions → Teste visual →
# Run workflow) na branch, com "atualizar" marcado. Ele grava a referência nova e
# faz o commit na própria branch, para a diferença aparecer no PR.
name: Teste visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      atualizar:
        description: Gravar a referência de novo e fazer o commit na branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    # a versão da imagem acompanha a do @playwright/test no package.json
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # o teste usa a demo (vite dev) direto de src/, sem o build da biblioteca
      - run: npm ci --ignore-scripts

      - name: Comparar com a referência
        if: ${{ !inputs.atualizar }}
        run: npx playwright test

      - name: Gravar a referência
        if: ${{ inputs.atualizar }}
        run: |
          rm -rf tests/visual/__referencia__/linux
          npx playwright test --update-snapshots --project=claro --project=escuro
          npx playwright test

      - name: Commit da referência
        if: ${{ inputs.atualizar }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__referencia__/linux
          git diff --cached --quiet || git commit -m "test: atualiza a referência visual"
          git push

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: relatorio-visual
          path: playwright-report/
          retention-days: 14
